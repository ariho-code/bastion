# Bastionscan advanced backend — Render Blueprint.
#
# Services:
#   1. bastionscan-engine — Go scanning engine (Docker, free OK)
#   2. bastionscan-brain  — Python risk + AI learning brain
#      → Starter plan + 1GB persistent disk at /var/data (best option)
#        so feedback, history, and advisor memory survive restarts.
#
# Deploy / update:
#   1. Push this repo to GitHub.
#   2. Render Dashboard → Blueprint → sync this repo (or New Blueprint).
#   3. Set secrets when prompted:
#        DEEPSEEK_API_KEY, VERIFY_SECRET
#   4. Vercel: BASTION_BRAIN_URL = https://bastionscan-brain.onrender.com
#
# Cost note: Free web services cannot attach disks. Brain uses starter so
# learning data is durable. Engine stays free.

services:
  # --- Go scanning engine ----------------------------------------------------
  - type: web
    name: bastionscan-engine
    runtime: docker
    dockerfilePath: ./engine/Dockerfile
    dockerContext: ./engine
    plan: free
    region: oregon
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: RATE_LIMIT_RPM
        value: "60"
      - key: MAX_CONCURRENCY
        value: "8"
      - key: SCAN_TIMEOUT
        value: "120s"
      - key: MODULE_TIMEOUT
        value: "30s"
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: VERIFY_SECRET
        sync: false
      - key: TRUSTED_PROXY
        value: "true"

  # --- Python risk brain + durable learning ---------------------------------
  - type: web
    name: bastionscan-brain
    runtime: docker
    dockerfilePath: ./brain/Dockerfile
    dockerContext: ./brain
    # Starter required for persistent disks (free cannot attach disks).
    plan: starter
    region: oregon
    healthCheckPath: /health
    autoDeploy: true
    disk:
      name: bastion-learning
      mountPath: /var/data
      sizeGB: 1
    envVars:
      # Public engine URL (free services have no private networking).
      - key: ENGINE_URL
        value: https://bastionscan-engine.onrender.com
      - key: ENGINE_TIMEOUT
        value: "120"
      - key: ALLOWED_ORIGINS
        value: "*"
      # Learning + RAG + ML weights live on the attached disk.
      - key: BASTION_LEARNING_DIR
        value: /var/data/bastion-learning
      # AI (set the secret value in Dashboard if not prompted by Blueprint)
      - key: AI_PROVIDER
        value: deepseek
      - key: AI_ENABLED
        value: "true"
      - key: AI_ON_ASSESS
        value: "true"
      - key: DEEPSEEK_API_KEY
        sync: false
