# Bastionscan advanced backend — Render Blueprint.
#
# One click deploys both services:
#   1. bastionscan-engine — the Go scanning engine (Docker, ./engine)
#   2. bastionscan-brain   — the Python risk brain (Docker, ./brain), wired to
#                            the engine automatically.
#
# Deploy:
#   1. Push this repo to GitHub.
#   2. Render Dashboard → New → Blueprint → pick this repo. Render reads this file.
#   3. After both services are live, copy the brain's URL and set it on Vercel:
#        BASTION_BRAIN_URL = https://bastionscan-brain.onrender.com
#      The Next.js /advanced page proxies to the brain, which drives the engine.
#
# Both run on the free plan. Free instances sleep when idle; the first scan
# after a nap takes a few extra seconds to wake them.

services:
  # --- Go scanning engine ----------------------------------------------------
  - type: web
    name: bastionscan-engine
    runtime: docker
    dockerfilePath: ./engine/Dockerfile
    dockerContext: ./engine
    plan: free
    region: oregon
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: RATE_LIMIT_RPM
        value: "60"
      - key: MAX_CONCURRENCY
        value: "8"
      - key: SCAN_TIMEOUT
        value: "120s"
      - key: MODULE_TIMEOUT
        value: "30s"
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: VERIFY_SECRET
        sync: false
      - key: TRUSTED_PROXY
        value: "true"

  # --- Python risk brain -----------------------------------------------------
  - type: web
    name: bastionscan-brain
    runtime: docker
    dockerfilePath: ./brain/Dockerfile
    dockerContext: ./brain
    # Free plan: no persistent disk. Upgrade plan, then uncomment `disk:` below
    # (or add the disk in the Dashboard → Disks → mount /var/data).
    plan: free
    region: oregon
    healthCheckPath: /health
    autoDeploy: true
    # disk:
    #   name: bastion-learning
    #   mountPath: /var/data
    #   sizeGB: 1
    envVars:
      # The brain reaches the engine over its PUBLIC url. Render's private
      # network (fromService host:port) is NOT available on the free plan, so we
      # use the deterministic public hostname instead. If you renamed the engine
      # service, or Render appended a suffix to its URL, update this value to
      # match the engine's real onrender.com URL.
      - key: ENGINE_URL
        value: https://bastionscan-engine.onrender.com
      - key: ENGINE_TIMEOUT
        value: "120"
      - key: ALLOWED_ORIGINS
        value: "*"
      # --- AI brain (set secret values in Render Dashboard → Environment) ---
      # Put DEEPSEEK_API_KEY (and later XAI_API_KEY / ANTHROPIC_API_KEY) on
      # bastionscan-brain ONLY — not on the Go engine.
      - key: AI_PROVIDER
        value: deepseek
      - key: AI_ENABLED
        value: "true"
      - key: AI_ON_ASSESS
        value: "true"
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: BASTION_LEARNING_DIR
        value: /var/data/bastion-learning
      # Optional later:
      # - key: XAI_API_KEY
      #   sync: false
      # - key: ANTHROPIC_API_KEY
      #   sync: false
      # - key: EMBEDDING_API_KEY
      #   sync: false
